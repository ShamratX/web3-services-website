<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found — Shamrat</title>
<meta name="description" content="That page does not exist. Head back to the Web3 development services homepage." />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#060913" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  .notfound {
    min-height: 100vh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 2rem 0;
  }
  .notfound-code {
    font-family: var(--mono);
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 1rem;
  }
  .notfound h1 { font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 1rem; }
  .notfound p { color: var(--muted); max-width: 46ch; margin-inline: auto; }
  .notfound-links { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-top: 2rem; }
</style>
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow bg-glow--one" aria-hidden="true"></div>

<main class="notfound">
  <div class="container container--narrow">
    <p class="notfound-code">Error 404</p>
    <h1>This page doesn't exist <span class="grad">on any chain</span></h1>
    <p>
      The link may be outdated or mistyped. Everything — services, portfolio and contact — lives on the
      homepage.
    </p>
    <div class="notfound-links">
      <a class="btn btn--primary" href="./">Back to homepage</a>
      <a class="btn btn--ghost" href="./#contact">Get in touch</a>
    </div>
  </div>
</main>
</body>
</html>
